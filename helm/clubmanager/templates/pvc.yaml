apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "clubmanager.name" . }}-data
  labels: {{- include "clubmanager.labels" . | nindent 4 }}
  annotations:
    # The SQLite DB and the tmclub.eu session live here: keep them when the release is removed.
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .Values.persistence.storageClass }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
