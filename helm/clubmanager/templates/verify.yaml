{{- if .Values.verify.host }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "clubmanager.name" . }}-verify
  labels: {{- include "clubmanager.labels" . | nindent 4 }}
spec:
  selector: {{- include "clubmanager.labels" . | nindent 4 }}
  ports:
    - name: verify
      port: 80
      targetPort: gateway
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "clubmanager.name" . }}-verify
  labels: {{- include "clubmanager.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.verify.ingressClassName }}
  rules:
    - host: {{ .Values.verify.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "clubmanager.name" . }}-verify
                port:
                  name: verify
{{- end }}
